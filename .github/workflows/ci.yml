name: CI

# No `branches:` filter: in a stack, upper PRs target the branch below them, not main.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The web build refuses to run without it; any bare origin works for a build-only check.
      API_ORIGIN: http://localhost:3001
      # Cloudflare's always-pass test key: the web build refuses to run without a site key.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub's dependency graph lists direct packages only, so audit the lockfile for what ships.
      # --prod leaves out dev and deploy tooling: the Vercel CLI's tree has open advisories that a
      # newer CLI doesn't clear, and they don't ship.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - name: Script tests
        run: |
          scripts/wait-for-health.test.sh
          scripts/neon-sweep.test.sh
          scripts/vercel-url.test.sh
          scripts/preview-seed.test.sh
          scripts/assert-main-tip.test.sh
          scripts/check-vercel-output.test.sh
          scripts/backup.test.sh
          scripts/restore-drill.test.sh
          scripts/install-sentry-cli.test.sh
          scripts/install-tofu.test.sh
          scripts/infra-guard.test.sh
          scripts/infra-plan-comment.test.sh
          scripts/extract-sourcemaps.test.sh
          node scripts/workflow-policy.mutations.test.mjs
          node scripts/workflow-policy.test.mjs
      - run: pnpm turbo run lint typecheck test build

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  # OpenTofu checks that need no credentials (spec 2026-10-27 §3.6). Plans run in infra-plan.yml.
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_CLI_CONFIG_FILE: /dev/null
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenTofu
        run: |
          scripts/install-tofu.sh "$RUNNER_TEMP/tofu"
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      - run: tofu fmt -check -recursive infra
      # -lockfile=readonly: providers must match the committed hashes, never be re-resolved here.
      - run: tofu -chdir=infra init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra validate
      - run: scripts/infra-guard.sh

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:integration

  migrations-lint:
    name: migrations-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint new or changed migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- 'apps/api/drizzle/*.sql')
          if [ -z "$files" ]; then
            echo "No migration changes."
            exit 0
          fi
          echo "$files"
          # shellcheck disable=SC2086 # one argument per file is intended
          npx --yes squawk-cli@2.67.0 $files

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wishlist/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
