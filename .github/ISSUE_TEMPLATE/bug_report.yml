name: Bug report
description: Something in Hanker doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't paste a share link (`/s/…`) or a manage link (`/c/…`).** Anyone holding one can read or change that list. Describe the page instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in
        2. Open /list
        3. …
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request ID
      description: The `requestId` from an error response, if you have one. It lets me find the matching log line.
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari 19 on iPhone
