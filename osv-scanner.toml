# Advisories OpenSSF Scorecard (.github/workflows/scorecard.yml) should not count, because they are
# only in tools that never ship in Hanker. Scorecard reads this file through osv-scanner. CI's audit gate
# (`pnpm audit --prod --audit-level high`) doesn't, so it still checks production dependencies.
#
# Entries match by advisory ID, not by package or path: before adding one, check that `pnpm audit --prod`
# doesn't report it. Each lapses on its ignoreUntil date, and Scorecard then raises it again. The monthly
# dev-tooling audit (docs/operations.md) removes the entries that are fixed and renews the rest.

[[IgnoredVulns]]
id = "GHSA-gxm5-99cw-xjw9" # @fastify/busboy 2.1.1
ignoreUntil = 2027-02-09
reason = "Only under the Vercel CLI (tools/vercel-cli, a devDependency), which deploys Hanker and never ships in it. It runs in deploy jobs on this repo’s own files, with --ignore-scripts (D85). vercel 65.12.1, the latest, still pins this version."

